<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Prep Tracker v1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🎓 Placement Prep Tracker</h1>
            <span id="network-status" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-500 text-white">Online</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 mt-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Log New Prep Activity</h2>
            <form id="task-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Topic / Problem</label>
                    <input type="text" id="task-title" required placeholder="e.g., Reverse a Linked List" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Category</label>
                    <select id="task-category" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-indigo-500">
                        <option value="DSA">Data Structures & Algos</option>
                        <option value="Aptitude">Quantitative Aptitude</option>
                        <option value="System Design">System Design</option>
                        <option value="Mock Interview">Mock Interview</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-2 rounded-lg text-sm transition shadow-sm">
                        ➕ Add Tracked Item
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">Your Tasks (Stored Offline via IndexedDB)</h2>
                <div class="text-xs text-gray-400" id="task-count">0 items tracked</div>
            </div>
            <div id="tasks-container" class="space-y-3">
                <p class="text-gray-400 text-sm text-center py-6">No tasks added yet. Start logging your progress!</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
